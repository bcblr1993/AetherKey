name: AetherKey
options:
  bundleIdPrefix: com.aethernative.inputmethod
  deploymentTarget:
    macOS: "14.0"
settings:
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  SWIFT_VERSION: "6.0"
  MARKETING_VERSION: "1.0.3"
  CURRENT_PROJECT_VERSION: "2026102501"
  ARCHS: "arm64"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  AetherKey:
    type: application
    platform: macOS
    sources:
      - Sources/AetherKey
      - path: Resources/zh-Hans.lproj
        type: folder
      - path: Resources/zh_CN.lproj
        type: folder
      - path: Resources/en.lproj
        type: folder
      - Resources/icon.tiff
      - Resources/menubar.pdf
      - Resources/icon.png
      - Resources/AppIcon.icns
      - Resources/lexicon.json
      - Resources/characters.json
      - Resources/characters-source.json
      - Resources/Unihan-LICENSE.txt
      - Resources/emoji.json
      - Resources/Unicode-LICENSE.txt
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.aethernative.inputmethod.AetherKey
      GENERATE_INFOPLIST_FILE: "NO"
      INFOPLIST_FILE: Resources/Info.plist
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGNING_REQUIRED: "NO"
      AD_HOC_CODE_SIGNING_ALLOWED: "YES"
      ENABLE_HARDENED_RUNTIME: "NO"
      ENABLE_TESTABILITY: "YES"
    dependencies:
      - package: Sparkle
        product: Sparkle

  AetherKeyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: AetherKey
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.aethernative.inputmethod.AetherKeyTests
      GENERATE_INFOPLIST_FILE: "YES"
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGNING_REQUIRED: "NO"

  AetherSetup:
    type: application
    platform: macOS
    sources:
      - path: Sources/AetherSetup
      - path: Sources/AetherKey/Model
      - path: Sources/AetherKey/Engine
      - path: Sources/AetherKey/UI
        excludes: [PreferencesView.swift]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.aethernative.inputmethod.AetherSetup
      GENERATE_INFOPLIST_FILE: "YES"
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGNING_REQUIRED: "NO"
